[package]
name = "rust-metrics-aggregator"
version = "0.1.0"
edition = "2021"
description = "A time-series metrics collection and aggregation library"
authors = ["Metrics Team"]
license = "MIT"

[lib]
name = "metrics_aggregator"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
