name: Daily Benchmark

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: daily-benchmark
  cancel-in-progress: false

jobs:
  setup-prs:
    name: Setup scenario PRs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr-matrix: ${{ steps.setup.outputs.pr-matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ secrets.BENCHMARK_GITHUB_TOKEN }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Force-push scenario branches and open PRs
        id: setup
        working-directory: scripts
        env:
          GITHUB_TOKEN: ${{ secrets.BENCHMARK_GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: npx tsx setup-prs.ts

  wait-for-checks:
    name: Wait for tool checks
    needs: setup-prs
    runs-on: ubuntu-latest
    outputs:
      checks-summary: ${{ steps.wait.outputs.checks-summary }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Poll GitHub Checks API until all tools complete
        id: wait
        working-directory: scripts
        env:
          GITHUB_TOKEN: ${{ secrets.BENCHMARK_GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          PR_MATRIX: ${{ needs.setup-prs.outputs.pr-matrix }}
          EXPECTED_CHECKS: ${{ vars.EXPECTED_CHECKS || 'CodeRabbit,Qodo Merge,BugBot,Sonar Review' }}
          POLL_INTERVAL_SECONDS: '30'
          TIMEOUT_SECONDS: '7200'
        run: npx tsx wait-for-checks.ts

  evaluate:
    name: Evaluate with Claude
    needs: [setup-prs, wait-for-checks]
    runs-on: ubuntu-latest
    outputs:
      evaluation-json: ${{ steps.evaluate.outputs.evaluation-json }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Run Claude evaluation
        id: evaluate
        working-directory: scripts
        env:
          GITHUB_TOKEN: ${{ secrets.BENCHMARK_GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          PR_MATRIX: ${{ needs.setup-prs.outputs.pr-matrix }}
          CHECKS_SUMMARY: ${{ needs.wait-for-checks.outputs.checks-summary }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
        run: npx tsx evaluate.ts

      - name: Upload evaluation artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: evaluation-${{ github.run_id }}
          path: /tmp/evaluation.json
          retention-days: 30

  report:
    name: Create GitHub Issue report
    needs: [setup-prs, evaluate]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Download evaluation artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444306234b73310d11984c78
        with:
          name: evaluation-${{ github.run_id }}
          path: /tmp
        continue-on-error: true

      - name: Create GitHub Issue report
        working-directory: scripts
        env:
          GITHUB_TOKEN: ${{ secrets.BENCHMARK_GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          PR_MATRIX: ${{ needs.setup-prs.outputs.pr-matrix }}
          EVALUATION_JSON: ${{ needs.evaluate.outputs.evaluation-json }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npx tsx report-github.ts
