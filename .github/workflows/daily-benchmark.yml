name: Daily Benchmark

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: daily-benchmark
  cancel-in-progress: false

jobs:
  setup-prs:
    name: Setup scenario PRs
    runs-on: sonar-xs
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    outputs:
      pr-matrix: ${{ steps.setup.outputs.pr-matrix }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.BENCHMARK_GITHUB_TOKEN }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Fetch Artifactory token
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_TOKEN;

      - name: Install dependencies
        working-directory: scripts
        run: |
          echo "//repox.jfrog.io/:_authToken=${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_TOKEN }}" >> ~/.npmrc
          npm ci

      - name: Force-push scenario branches and open PRs
        id: setup
        working-directory: scripts
        env:
          GITHUB_TOKEN: ${{ secrets.BENCHMARK_GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: npx tsx setup-prs.ts

  wait-for-checks:
    name: Wait for tool checks
    needs: setup-prs
    runs-on: sonar-xs
    permissions:
      id-token: write
      contents: read
      checks: read
    outputs:
      checks-summary: ${{ steps.wait.outputs.checks-summary }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Fetch Artifactory token
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_TOKEN;

      - name: Install dependencies
        working-directory: scripts
        run: |
          echo "//repox.jfrog.io/:_authToken=${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_TOKEN }}" >> ~/.npmrc
          npm ci

      - name: Poll GitHub Checks API until all tools complete
        id: wait
        working-directory: scripts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          PR_MATRIX: ${{ needs.setup-prs.outputs.pr-matrix }}
          # Check names for tools that post GitHub check runs
          EXPECTED_CHECKS: ${{ vars.EXPECTED_CHECKS || 'Sonar Review,Claude Code Review,Cursor Bugbot' }}
          POLL_INTERVAL_SECONDS: '30'
          TIMEOUT_SECONDS: '600'
        run: npx tsx wait-for-checks.ts

  evaluate:
    name: Evaluate with Claude
    needs: [setup-prs, wait-for-checks]
    runs-on: sonar-xs
    permissions:
      id-token: write
      contents: read
    outputs:
      evaluation-json: ${{ steps.evaluate.outputs.evaluation-json }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Fetch Artifactory token
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_TOKEN;

      - name: Install dependencies
        working-directory: scripts
        run: |
          echo "//repox.jfrog.io/:_authToken=${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_TOKEN }}" >> ~/.npmrc
          npm ci

      - name: Run Claude evaluation
        id: evaluate
        working-directory: scripts
        env:
          GITHUB_TOKEN: ${{ secrets.BENCHMARK_GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          PR_MATRIX: ${{ needs.setup-prs.outputs.pr-matrix }}
          CHECKS_SUMMARY: ${{ needs.wait-for-checks.outputs.checks-summary }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
        run: npx tsx evaluate.ts

      - name: Upload evaluation artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: evaluation-${{ github.run_id }}
          path: /tmp/evaluation.json
          retention-days: 30

  report:
    name: Post Slack report
    needs: [setup-prs, evaluate]
    runs-on: sonar-xs
    if: always()
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Fetch secrets
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_TOKEN;
            development/kv/data/slack token | SLACK_TOKEN;

      - name: Install dependencies
        working-directory: scripts
        run: |
          echo "//repox.jfrog.io/:_authToken=${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_TOKEN }}" >> ~/.npmrc
          npm ci

      - name: Download evaluation artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: evaluation-${{ github.run_id }}
          path: /tmp
        continue-on-error: true

      - name: Post Slack report
        working-directory: scripts
        env:
          SLACK_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).SLACK_TOKEN }}
          SLACK_CHANNEL: '#code-review-benchmark-reports'
          PR_MATRIX: ${{ needs.setup-prs.outputs.pr-matrix }}
          EVALUATION_JSON: ${{ needs.evaluate.outputs.evaluation-json }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npx tsx report-slack.ts

  cleanup:
    name: Close scenario PRs
    needs: [setup-prs, report]
    runs-on: sonar-xs
    if: always() && needs.setup-prs.result == 'success'
    permissions:
      pull-requests: write
    steps:
      - name: Close scenario PRs
        env:
          GH_TOKEN: ${{ secrets.BENCHMARK_GITHUB_TOKEN }}
          PR_MATRIX: ${{ needs.setup-prs.outputs.pr-matrix }}
        run: |
          echo "$PR_MATRIX" | jq -r '.[].prNumber' | while read -r pr; do
            gh pr close "$pr" --repo "${{ github.repository }}" 2>/dev/null && echo "Closed #$pr" || echo "PR #$pr already closed"
          done
